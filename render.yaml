services:
  - type: web
    name: raj-art-dashboard
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: sqlite:////var/data/raj_art.db
    disk:
      name: raj-art-data
      mountPath: /var/data
      sizeGB: 1
